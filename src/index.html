<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaGrace Lehuni - Software Engineer</title>
    
    <!-- Police -->
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=trench-slab@300,400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=khand@300,400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=array@401,400,600,601,701,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=supreme@300,400,500,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/main.css">
    
    <!-- Script officiel d'Iconify pour les Web Components -->
    <script type="module" src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
</head>
<body class="home-page">

    <div class="container">
        
        <div class="header__nav-wrapper" id="nav-wrapper"></div>

        <!-- Bouton Menu -->
        <button class="header__menu-btn" id="menu-btn">
            <div class="header__menu-icon">
                <span></span>
                <span></span>
            </div>
            <span data-i18n="menu_btn">Menu</span>
        </button>

        <header class="header">
            <div class="header__title-group">
                <h1 class="header__title" data-i18n="title">LaGrace Lehuni<br><span>Software Engineer</span></h1>
                <p class="header__location" data-i18n="location">(Kinshasa, DRC)</p>
            </div>
            <div class="header__bottom">
                <span data-i18n="scroll_down">Scroll Down</span>
                <svg viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
            </div>
        </header>

        <section class="hero">
            <img class="hero__image" src="/img/profile-llehunix.jpg" alt="Portrait de LaGrace Lehuni">
        </section>

        <section class="about" id="about">
            <h2 class="about__text" id="about-text"></h2>
            <div class="about__sidebar">
                <span class="about__label" data-i18n="about_label">(About Me)</span>
                <div class="about__dots" id="slider-dots">
                    <div class="about__dot active" data-index="0"></div>
                    <div class="about__dot" data-index="1"></div>
                    <div class="about__dot" data-index="2"></div>
                    <div class="about__dot" data-index="3"></div>
                </div>
            </div>
        </section>

        <section class="links-action" id="realisations">
            <a href="#" class="btn-liquid" data-i18n="btn_cv">Download my CV</a>
            <a href="/project" class="btn-liquid" data-i18n="btn_projects">See my projects</a>
        </section>

        <section class="contact" id="contact">
            <div class="contact__sidebar">
                <span class="contact__label" data-i18n="contact_label">(How to contact me)</span>
            </div>
            
            <div class="contact__grid">
                <a href="#" class="contact-item">
                    <span class="contact-item__title">Instagram</span>
                    <iconify-icon icon="line-md:instagram" class="contact-item__icon"></iconify-icon>
                </a>
                <a href="#" class="contact-item">
                    <span class="contact-item__title">LinkedIn</span>
                    <iconify-icon icon="line-md:linkedin" class="contact-item__icon"></iconify-icon>
                </a>
                <a href="https://github.com/llehuni" class="contact-item" target="_blank" rel="noopener noreferrer">
                    <span class="contact-item__title">GitHub</span>
                    <iconify-icon icon="line-md:github" class="contact-item__icon"></iconify-icon>
                </a>
                <a href="mailto:lehunilagrace@gmail.com" class="contact-item">
                    <span class="contact-item__title">Gmail</span>
                    <iconify-icon icon="line-md:email" class="contact-item__icon"></iconify-icon>
                </a>
            </div>
        </section>

        <footer class="footer" id="site-footer"></footer>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
