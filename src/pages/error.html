<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__ERROR_CODE__ - Error</title>
    
    <!-- Police -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="error-page" data-error-code="__ERROR_CODE__">

    <div class="container">
        
        <!-- SWITCH DE LANGUE (Ancienne position du bouton menu) -->
        <div class="header__lang-switch">
            <button class="header__lang-btn active" data-lang="en">EN</button>
            <span>|</span>
            <button class="header__lang-btn" data-lang="fr">FR</button>
        </div>

        <!-- CONTENU DYNAMIQUE -->
        <main class="error-section">
            <h1 class="error__code" data-error-code="__ERROR_CODE__">__ERROR_CODE__</h1>
            <h2 class="error__title" data-i18n="error_title"></h2>
            <p class="error__desc" data-i18n="error_desc">
            </p>
            
            <a href="/" class="btn-liquid">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span data-i18n="back_home">Back to Home</span>
            </a>
        </main>

        <!-- FOOTER -->
        <footer class="footer" id="site-footer"></footer>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
