<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    
    <!-- Police -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-bg: #f2f1ef;
            --color-text: #111111;
            --color-text-muted: #555555;
            --color-border: rgba(17, 17, 17, 0.2);
            --font-main: 'Inter', sans-serif;
            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 2rem;
            --space-lg: 4rem;
            --space-xl: 6rem;
            --max-width: 1200px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        img { max-width: 100%; display: block; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            background-color: var(--color-bg);
            border-left: 1px solid var(--color-border);
            border-right: 1px solid var(--color-border);
            position: relative;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* =========================================
           SWITCH DE LANGUE (Remplace le bouton menu)
           ========================================= */
        .header__lang-switch {
            position: absolute;
            top: var(--space-lg);
            right: var(--space-md);
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--color-text);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 500;
            z-index: 60;
        }

        .header__lang-switch span {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.875rem;
            user-select: none;
        }

        .header__lang-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: inherit;
            font-weight: inherit;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .header__lang-btn:hover {
            color: var(--color-bg);
        }

        .header__lang-btn.active {
            color: var(--color-bg);
        }

        /* =========================================
           CONTENU 404
           ========================================= */
        .error-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: var(--space-xl) var(--space-md);
            text-align: center;
            position: relative;
        }

        .error__code {
            font-size: clamp(8rem, 25vw, 20rem);
            font-weight: 700;
            line-height: 0.8;
            letter-spacing: -0.05em;
            color: transparent;
            -webkit-text-stroke: 2px var(--color-text);
            position: relative;
            margin-bottom: var(--space-md);
            user-select: none;
        }

        .error__code::after {
            content: '404';
            position: absolute;
            top: 4px;
            left: 4px;
            color: var(--color-text);
            -webkit-text-stroke: 0;
            z-index: -1;
            opacity: 0.1;
        }

        .error__title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: var(--space-sm);
        }

        .error__desc {
            font-size: 1.125rem;
            color: var(--color-text-muted);
            max-width: 500px;
            margin-bottom: var(--space-lg);
        }

        /* BOUTON LIQUID */
        .btn-liquid {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-xs);
            padding: 1rem 2.5rem;
            border: 1px solid var(--color-text);
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--color-text);
            overflow: hidden;
            z-index: 1;
            transition: color 0.35s ease;
        }

        .btn-liquid::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--color-text);
            transform: scaleY(0);
            transform-origin: bottom center;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
        }

        .btn-liquid:hover { color: var(--color-bg); }
        .btn-liquid:hover::before { transform: scaleY(1); }

        .btn-liquid svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =========================================
           FOOTER
           ========================================= */
        .footer {
            padding: var(--space-md) 0;
            overflow: hidden;
            background-color: var(--color-bg);
            display: flex;
            border-top: 1px solid var(--color-border);
        }

        .marquee {
            display: flex;
            white-space: nowrap;
            font-size: clamp(4rem, 15vw, 12rem);
            font-weight: 600;
            letter-spacing: -0.04em;
            line-height: 1;
            color: var(--color-text);
            animation: scroll 15s linear infinite;
        }

        .marquee span { padding-right: var(--space-md); }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .header__lang-switch { top: var(--space-md); right: var(--space-md); }
            .error__code { -webkit-text-stroke: 1px var(--color-text); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- SWITCH DE LANGUE (Ancienne position du bouton menu) -->
        <div class="header__lang-switch">
            <button class="header__lang-btn active" data-lang="en">EN</button>
            <span>|</span>
            <button class="header__lang-btn" data-lang="fr">FR</button>
        </div>

        <!-- CONTENU 404 -->
        <main class="error-section">
            <h1 class="error__code">404</h1>
            <h2 class="error__title" data-i18n="error_title">Page not found.</h2>
            <p class="error__desc" data-i18n="error_desc">
                The page you are looking for doesn't exist or has been moved. Let's get you back on track.
            </p>
            
            <a href="index.html" class="btn-liquid">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span data-i18n="back_home">Back to Home</span>
            </a>
        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="marquee">
                <span data-i18n="footer_text">I build stuff.&nbsp;</span>
                <span data-i18n="footer_text">I build stuff.&nbsp;</span>
                <span data-i18n="footer_text">I build stuff.&nbsp;</span>
                <span data-i18n="footer_text">I build stuff.&nbsp;</span>
            </div>
        </footer>
    </div>

    <script>
        const translations = {
            en: {
                error_title: "Page not found.",
                error_desc: "The page you are looking for doesn't exist or has been moved. Let's get you back on track.",
                back_home: "Back to Home",
                footer_text: "I build stuff."
            },
            fr: {
                error_title: "Page introuvable.",
                error_desc: "La page que vous recherchez n'existe pas ou a été déplacée. Revenons sur le bon chemin.",
                back_home: "Retour à l'accueil",
                footer_text: "Je construis des trucs."
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            
            let currentLang = 'en';

            // Traduction
            function applyLanguage(lang) {
                currentLang = lang;
                document.querySelectorAll('[data-i18n]').forEach(element => {
                    const key = element.getAttribute('data-i18n');
                    if (translations[lang][key]) {
                        element.textContent = translations[lang][key];
                    }
                });
                document.querySelectorAll('.header__lang-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
                });
                document.documentElement.lang = lang;
            }

            // Écouteurs sur les boutons de langue
            document.querySelectorAll('.header__lang-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    applyLanguage(e.currentTarget.getAttribute('data-lang'));
                });
            });

            applyLanguage('en');
        });
    </script>
</body>
</html>
