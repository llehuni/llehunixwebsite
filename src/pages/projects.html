<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bent Lindberg - Web Apps</title>
    
    <!-- Police -->
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=trench-slab@300,400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=khand@300,400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=array@401,400,600,601,701,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=supreme@300,400,500,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=technor@300,400,500,600,700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="projects-page">

    <div class="container">
        
        <div class="header__nav-wrapper" id="nav-wrapper"></div>

        <!-- Bouton Menu -->
        <button class="header__menu-btn" id="menu-btn">
            <div class="header__menu-icon">
                <span></span>
                <span></span>
            </div>
            <span data-i18n="menu_btn">Menu</span>
        </button>

        <header class="header">
            <div class="header__title-group">
                <h1 class="header__title" data-i18n="page_title">Web Apps<br>Projects.</h1>
                <p class="header__location" data-i18n="page_subtitle">A collection of my recent web applications.</p>
            </div>
            <div class="header__bottom">
                <a href="/" class="back-link">
                    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    <span data-i18n="back_home">Back to Home</span>
                </a>
            </div>
        </header>

        <!-- GRILLE DE PROJETS -->
        <section class="projects" id="work">
            <div class="projects__grid" id="projects-grid">
                <!-- Les cartes sont générées par JavaScript -->
            </div>
        </section>

        <footer class="footer" id="site-footer"></footer>
    </div>

    <!-- MODAL PROJECT DETAIL -->
    <div class="modal" id="project-modal">
        <div class="modal__header">
            <div class="modal__nav">
                <button class="modal__nav-btn" id="prev-project">
                    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                    <span data-i18n="prev_project">Previous</span>
                </button>
                <button class="modal__nav-btn" id="next-project">
                    <span data-i18n="next_project">Next</span>
                    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
            <button class="modal__close" id="close-modal">
                <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>

        <div class="modal__body">
            <!-- Section 1 : Slider -->
            <div class="modal__slider-section">
                <div class="modal__slider-controls">
                    <button class="slider-arrow" id="prev-image" disabled>
                        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <button class="slider-arrow" id="next-image">
                        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                </div>
                <div class="modal__slider" id="modal-slider">
                    <!-- Les images seront injectées ici -->
                </div>
                <!-- 1. Conteneur des Dots -->
                <div class="modal__slider-dots" id="modal-slider-dots">
                    <!-- Les dots seront injectés ici -->
                </div>
            </div>

            <!-- Section 2 : Infos -->
            <div class="modal__info-section">
                <h2 class="modal__title" id="modal-title">App Name</h2>
                <p class="modal__desc" id="modal-desc">Brief description.</p>
                
                <div class="modal__stack" id="modal-stack">
                    <!-- Stack injectée ici -->
                </div>

                <!-- 2. Bouton GitHub avec classe .btn-liquid -->
                <a href="#" class="btn-liquid" id="modal-github" target="_blank">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                    <span data-i18n="view_github">View on GitHub</span>
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
